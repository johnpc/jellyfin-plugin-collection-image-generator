name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest.json"
      - "**.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore jellyfin-plugin-collection-image-generator.sln
      - name: Check formatting
        run: dotnet format jellyfin-plugin-collection-image-generator.sln --verify-no-changes
      - name: Build (strict)
        run: dotnet build jellyfin-plugin-collection-image-generator.sln --configuration Release /p:TreatWarningsAsErrors=true
      - name: Run unit tests with coverage
        run: |
          dotnet test Jellyfin.Plugin.CollectionImageGenerator.Tests/Jellyfin.Plugin.CollectionImageGenerator.Tests.csproj \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=json \
            /p:CoverletOutput=../coverage/coverage.json \
            '/p:Include=[Jellyfin.Plugin.CollectionImageGenerator]*' \
            /p:ThresholdType=line \
            /p:Threshold=80
      - name: Run acceptance tests
        run: |
          dotnet test Jellyfin.Plugin.CollectionImageGenerator.AcceptanceTests/Jellyfin.Plugin.CollectionImageGenerator.AcceptanceTests.csproj \
            --configuration Release \
            --no-build
      - name: CRAP score check
        run: bash scripts/check-crap.sh coverage/coverage.json

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get next version
      id: get_version
      run: |
        LATEST=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.' | head -1)
        if [ -z "$LATEST" ]; then
          LATEST="0.0.0.0"
        fi
        NEXT=$(echo "$LATEST" | awk -F. '{$NF=$NF+1; print}' OFS=.)
        echo "VERSION=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.CollectionImageGenerator.csproj

    - name: Build
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        dotnet build Jellyfin.Plugin.CollectionImageGenerator.csproj --configuration Release --no-restore \
          /p:TreatWarningsAsErrors=true \
          /p:Version=$VERSION \
          /p:AssemblyVersion=$VERSION \
          /p:FileVersion=$VERSION

    - name: Create release zip
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release
        cp bin/Release/net10.0/Jellyfin.Plugin.CollectionImageGenerator.dll release/
        cp bin/Release/net10.0/SixLabors.ImageSharp.dll release/
        cp bin/Release/net10.0/SixLabors.ImageSharp.Drawing.dll release/
        cp bin/Release/net10.0/SixLabors.Fonts.dll release/
        cd release
        zip -r ../collection-image-generator-${VERSION}.zip .

    - name: Calculate checksum
      id: calculate_checksum
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        CHECKSUM=$(md5sum collection-image-generator-${VERSION}.zip | awk '{ print $1 }')
        echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT

    - name: Update manifest.json (prepend new version)
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        CHECKSUM: ${{ steps.calculate_checksum.outputs.CHECKSUM }}
      run: |
        # targetAbi single source of truth: build.yaml
        TARGET_ABI=$(grep -E '^targetAbi:' build.yaml | head -1 | sed -E 's/^targetAbi:[[:space:]]*"?([0-9.]+)"?.*/\1/')
        if [ -z "$TARGET_ABI" ]; then
          echo "::error::targetAbi not found in build.yaml"
          exit 1
        fi
        export TARGET_ABI
        python3 << 'PYEOF'
        import json, os, sys
        from datetime import datetime, timezone

        version = os.environ["VERSION"]
        checksum = os.environ["CHECKSUM"]
        target_abi = os.environ["TARGET_ABI"]
        repo = "johnpc/jellyfin-plugin-collection-image-generator"

        # Git checkout is the source of truth for the existing manifest.
        # NEVER fetch the previous manifest over the network.
        if not os.path.exists("manifest.json"):
            print("::warning::manifest.json MISSING from checkout -- starting from an "
                  "EMPTY manifest. All historical version entries will be absent!")
            manifest = [{
                "guid": "e29b0e3d-f15e-47b9-9b3d-ed3df892e33d",
                "name": "Collection Image Generator",
                "overview": "Automatically generates collage images for collections without images",
                "description": "A Jellyfin plugin that automatically generates collage images for collections without images.",
                "owner": "johnpc",
                "category": "Metadata",
                "versions": [],
            }]
        else:
            try:
                with open("manifest.json", encoding="utf-8") as f:
                    manifest = json.load(f)
            except json.JSONDecodeError as e:
                print(f"::error::existing manifest.json is invalid JSON: {e}")
                sys.exit(1)

        plugin = manifest[0]
        entry = {
            "version": version,
            "changelog": f"https://github.com/{repo}/releases/tag/{version}",
            "targetAbi": target_abi,
            "sourceUrl": f"https://github.com/{repo}/releases/download/{version}/collection-image-generator-{version}.zip",
            "checksum": checksum,
            "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
        }
        # Dedupe by version (new wins); existing entries are preserved untouched.
        versions = [v for v in plugin["versions"] if v.get("version") != version]
        versions.append(entry)
        versions.sort(key=lambda v: tuple(int(x) for x in v["version"].split(".")), reverse=True)
        plugin["versions"] = versions

        with open("manifest.json", "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=2)
            f.write("\n")
        print(f"manifest.json now has {len(versions)} version entries; newest {versions[0]['version']}")
        PYEOF

    - name: Validate manifest.json
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/validate-manifest.py \
          --new-version "$VERSION" \
          --zip "collection-image-generator-${VERSION}.zip"

    - name: Create tag and GitHub Release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION"
        git push origin "$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        files: |
          collection-image-generator-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify published release asset matches manifest
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        SOURCE_URL=$(python3 -c "import json; print(json.load(open('manifest.json'))[0]['versions'][0]['sourceUrl'])")
        EXPECTED=$(python3 -c "import json; print(json.load(open('manifest.json'))[0]['versions'][0]['checksum'])")
        echo "Downloading published asset: $SOURCE_URL"
        curl -sSL --fail --retry 5 --retry-delay 5 --retry-all-errors -o published.zip "$SOURCE_URL"
        ACTUAL=$(md5sum published.zip | awk '{ print $1 }')
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Published asset md5 ($ACTUAL) does not match manifest checksum ($EXPECTED)"
          exit 1
        fi
        echo "Published asset verified: md5 $ACTUAL matches manifest entry for $VERSION"

    - name: Update manifest on main
      run: |
        cp manifest.json /tmp/manifest.json
        git checkout -- manifest.json
        git fetch origin main
        git checkout -B main origin/main
        cp /tmp/manifest.json manifest.json
        git add manifest.json
        git diff --cached --quiet || git commit -m "chore: update manifest for ${{ steps.get_version.outputs.VERSION }}"
        git push origin main
